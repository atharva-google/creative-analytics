[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "creative-analytics"
version = "0.1.0"
description = "Brand profiling and video ad feature extraction with Gemini."
requires-python = ">=3.10"
dependencies = [
    "google-genai>=1.0",
    "pydantic>=2.0",
    "scenedetect>=0.6",
    "opencv-python-headless",
    "yt-dlp",
]

[tool.setuptools.packages.find]
include = ["creative_analytics*"]
